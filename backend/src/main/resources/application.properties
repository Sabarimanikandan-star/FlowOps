spring.application.name=flowops

# ---------------------------------------------------------------- Server
server.port=8080
server.servlet.context-path=
# Never leak stack traces / internal messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------- Database
# Credentials come from environment variables. Nothing secret is stored in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flowops?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------- JPA / Hibernate
# The existing MySQL schema is the source of truth: Hibernate may only VALIDATE it.
# Never use create, create-drop or update.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Schema uses DATETIME(3) in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------- JWT
# JWT_SECRET: base64-encoded random value, at least 32 bytes. Must be supplied via environment.
flowops.security.jwt.secret=${JWT_SECRET:}
# Milliseconds. 900000 = 15 minutes
flowops.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# Milliseconds. 604800000 = 7 days
flowops.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---------------------------------------------------------------- Logging
logging.level.root=INFO
logging.level.com.flowops=INFO

# ---------------------------------------------------------------- Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized